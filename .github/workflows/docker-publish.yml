name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main

env:
  DOCKERHUB_IMAGE: nahuelnucera/ministack
  DOCKERHUB_IMAGE_ORG: ministackorg/ministack
  GHCR_IMAGE: ghcr.io/lonegunmanb/ministack

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Regular (Alpine) image — :latest, :{version}, :{major}.{minor} ──
      - name: Extract metadata (regular)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ startsWith(github.ref, 'refs/tags/') && env.DOCKERHUB_IMAGE || '' }}
            ${{ startsWith(github.ref, 'refs/tags/') && env.DOCKERHUB_IMAGE_ORG || '' }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push (regular)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINISTACK_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=regular
          cache-to: type=gha,mode=max,scope=regular

      # ── Full (Debian/glibc) image — :full, :{version}-full, :{major}.{minor}-full ──
      # Adds DuckDB (Athena engine), psycopg2-binary, pymysql. Larger
      # image (~360 MB vs ~110 MB) but all manylinux wheels install
      # cleanly. Tracks the same release cadence as regular until
      # issue #411 has a longer-term answer.
      - name: Extract metadata (full)
        id: meta_full
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ startsWith(github.ref, 'refs/tags/') && env.DOCKERHUB_IMAGE || '' }}
            ${{ startsWith(github.ref, 'refs/tags/') && env.DOCKERHUB_IMAGE_ORG || '' }}
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-full
            type=semver,pattern={{major}}.{{minor}},suffix=-full
            type=raw,value=full,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main-full,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,suffix=-full,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push (full)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_full.outputs.tags }}
          labels: ${{ steps.meta_full.outputs.labels }}
          build-args: |
            MINISTACK_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
